# pnpm settings. These lived in package.json's "pnpm" field until pnpm 11 stopped
# reading it ("The `pnpm` field in package.json is no longer read by pnpm"), which
# left the effective overrides empty while pnpm-lock.yaml still recorded them — and
# --frozen-lockfile correctly refused the mismatch (ELEG-4). This file is the
# documented new home and is read by both 10.x and 11.x.

# Security pins, not compatibility shims — keep them.
#
# Every entry here is a FLOOR raising a transitive dependency to its patched version
# (ELEG-63). A floor rather than a lockfile bump on purpose: `pnpm update` moves the
# lockfile and the next resolution can quietly move it back, whereas an override is
# re-asserted on every install and carries the reason next to the number.
#
# Nothing in the gates looks at advisories — `.github/workflows/audit.yml` does, weekly
# and on changes to the lockfile, and Dependabot raises the PRs. See that workflow for
# why this is deliberately NOT a gate in scripts/gates.sh.
#
# When a direct dependency's own range catches up, delete the line rather than leaving
# a floor nobody can date. Check with: pnpm why <pkg>
overrides:
  undici: '>=6.24.0'

  # @modelcontextprotocol/sdk 1.30.0 → express / ajv / express-rate-limit / hono.
  # Its declared ranges already permit all of these; only the lockfile was stale.
  hono: '>=4.12.34'
  '@hono/node-server': '>=2.0.5'
  qs: '>=6.15.2'
  body-parser: '>=2.3.0'
  fast-uri: '>=3.1.5'
  ip-address: '>=10.3.1'

  # @huggingface/transformers 4.2.0 → onnxruntime-{node,web}. These two DO cross their
  # parent's declared range (onnxruntime-node wants adm-zip ^0.5.16), so they are the
  # only entries here that upstream has not itself blessed. Reached solely through the
  # dynamic import in src/server/ai-monitor.ts, i.e. only when AI_PROVIDER selects the
  # local CLIP path — which no test covers. Verified by importing the package.
  adm-zip: '>=0.6.0'
  protobufjs: '>=7.6.5'
  # sharp is also a DIRECT dependency here at 0.35.x and that copy was never affected;
  # the advisory is against the second, older copy transformers pulled in beside it.
  # The floor collapses the two into one — which also halves the native binary payload.
  sharp: '>=0.35.0'

  # tsx → esbuild. tsx is a runtime dependency here: production runs the TypeScript
  # directly under `node --import tsx`, so this is not a build-only advisory.
  esbuild: '>=0.28.1'

# Which dependencies may run install scripts (ELEG-9). pnpm 11 REMOVED
# `onlyBuiltDependencies`, which this file used to carry. It is ignored now, not
# misread. `strictDepBuilds` defaults to true in 11, so any build script not listed
# here fails the install with ERR_PNPM_IGNORED_BUILDS. That is a review prompt, not an
# obstacle: a dependency that gains an install script must be approved by name.
#
# Only packages that actually HAVE an install script at their locked version are
# listed. sharp (0.35.x) and protobufjs (8.x) were on the old list and ship none, so an
# entry for them would pre-approve a script nobody has read.
#
# Trap: a failing install WRITES placeholder entries ("set this to true or false")
# into this file. Do not commit them.
allowBuilds:
  # postinstall verifies the platform binary. tsx needs it at runtime.
  esbuild: true
  # postinstall fetches its native provider libraries. Needed for the local CLIP
  # path in src/server/ai-monitor.ts.
  onnxruntime-node: true
  # Its postinstall would install the git hooks. The `prepare` script already does
  # that, and pnpm 10 never ran this script either, so false changes nothing.
  simple-git-hooks: false

# Supply-chain policy (ELEG-9). pnpm 11 refuses any package version published less than
# this many minutes ago. That defends against a compromised release being pulled within
# hours of going up. 1440 is already pnpm 11's default. It is set EXPLICITLY on purpose:
#
#   - An explicit value turns `minimumReleaseAgeStrict` on; pnpm's config loader does
#     that only when this key is set. Measured: with strict off, `pnpm add pkg@<exact
#     too-new version>` installs the too-new version anyway AND writes a
#     `minimumReleaseAgeExclude` entry for it into this file, so the exemption rides
#     into the next commit unnoticed. With strict on the add fails with
#     ERR_PNPM_NO_MATURE_MATCHING_VERSION. A policy that gives way to whoever asks is
#     not a policy.
#   - The number lives here, not in whichever default the installed pnpm has.
#
# Do NOT lower it to get a PR green. ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION on a lockfile
# entry heals by itself once that entry is 24h old. Dependabot's `cooldown` in
# .github/dependabot.yml keeps its PRs outside the window.
minimumReleaseAge: 1440

updateConfig:
  ignoreDependencies:
    - three
    - '@types/three'
