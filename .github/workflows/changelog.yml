name: Changelog

# The changeset check this repo can have (ELEG-112).
#
# There are no changesets here: the release notes and CHANGELOG.md are generated by
# `release-it` + `@release-it/conventional-changelog` from the commit subjects on `main`.
# So the "changeset" a PR carries is the subject it will land with, and this workflow
# fails the PR when that subject would not parse — because an unparseable subject does not
# error at release time, it silently produces no changelog line at all.
#
# WHAT IT READS
#
# The subject that actually lands under the repository's squash setting
# (`COMMIT_OR_PR_TITLE`): the sole commit's subject for a one-commit PR, the PR title
# otherwise. A "semantic PR title" action checks the title in both cases, which is the
# wrong string for the common one-commit PR — Dependabot's, and every agent's. The rule and
# the parser live in scripts/landing-subject.ts, which src/__tests__/landing-subject.test.ts
# covers; the allowed types are read from .release-it.json so this check and the generator
# cannot drift apart.
#
# `edited` is in the trigger list on purpose: fixing a multi-commit PR means editing its
# title, and the check has to re-run on that. A title edit alone does not re-run CI.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  landing-subject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same three setup steps as ci.yml, for the same reasons — see the comments there.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # First line of every commit message, as a JSON array, in PR order. `--paginate` so a
      # PR past the 30-commit page still gets counted — only the count matters for which
      # string lands, but a wrong count is a wrong string.
      - name: Collect the PR's commit subjects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" \
            --jq '[.[].commit.message | split("\n")[0]]' \
            | jq -s 'add' > "$RUNNER_TEMP/commits.json"
          jq -r 'length as $n | "\($n) commit(s)"' "$RUNNER_TEMP/commits.json"

      # The title goes in through the environment, never interpolated into the script: on a
      # public repo it is text anyone can write.
      - name: Check the subject that would land on main
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_COMMITS_FILE: ${{ runner.temp }}/commits.json
        run: pnpm exec tsx scripts/check-landing-subject.ts
