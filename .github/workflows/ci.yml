name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` on purpose — action-setup then reads `packageManager` from
      # package.json, so CI uses the exact pnpm developers use. `version: latest`
      # silently moved CI to pnpm 11 while everyone here was on 10.x, which broke
      # the frozen install two different ways (ELEG-4).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One step, not four. `scripts/gates.sh` is the single list of what has to pass,
      # so a gate can no longer exist in the repo but be missing from CI — which is
      # exactly how the backend went unchecked (ELEG-5).
      #
      # It is a strict superset of the four steps it replaced: `biome ci src/` covers
      # both `lint` and `format:check`, `tsc` + `vite build` is `build`, `vitest run`
      # is `test` — PLUS `service:check`, the typecheck of src/server that
      # tsconfig.json excludes and CI therefore never ran.
      #
      # It also reports every failing gate in one run rather than stopping at the first.
      - run: pnpm gates
