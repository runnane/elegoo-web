name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` on purpose — action-setup then reads `packageManager` from
      # package.json, so CI uses the exact pnpm developers use. `version: latest`
      # silently moved CI to pnpm 11 while everyone here was on 10.x, which broke
      # the frozen install two different ways (ELEG-4). Still optional-when-
      # packageManager-is-present in v6, so the bump did not reintroduce it.
      #
      # Still `pnpm/action-setup`. Its successor `pnpm/setup` requires pnpm v11+, which
      # ELEG-9 made possible. action-setup@v6 reads the 11.x `packageManager` pin just
      # as it read 10.x, so ELEG-9 kept the action and changed only the pin.
      #
      # `node-version: 22` resolves to the newest 22.x, which satisfies pnpm 11's
      # `engines.node >=22.13`.
      - uses: pnpm/action-setup@v6

      # `cache: pnpm` is explicit and must stay. setup-node v5 added automatic
      # caching driven by `packageManager`, then v6 narrowed that to npm only — so
      # the automatic path does not cover pnpm and dropping this line would silently
      # lose the store cache. This step must also stay AFTER action-setup: the cache
      # resolution shells out to pnpm.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One step, not four. `scripts/gates.sh` is the single list of what has to pass,
      # so a gate can no longer exist in the repo but be missing from CI — which is
      # exactly how the backend went unchecked (ELEG-5).
      #
      # It is a strict superset of the four steps it replaced: `biome ci src/` covers
      # both `lint` and `format:check`, `tsc` + `vite build` is `build`, `vitest run`
      # is `test` — PLUS `service:check`, the typecheck of src/server that
      # tsconfig.json excludes and CI therefore never ran.
      #
      # It also reports every failing gate in one run rather than stopping at the first.
      - run: pnpm gates
